[project]
name = "airlock"
version = "0.1.0"
description = "A control tower for database agents. Governs every statement an autonomous agent runs against Exasol."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyexasol>=0.27",
    "sqlglot>=25.0",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.scripts]
airlock-mcp = "airlock.mcp_server:main"
airlock-api = "airlock.api:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.ruff]
line-length = 100
